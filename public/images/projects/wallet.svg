<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06102A"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1558C9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1558C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- wallet A -->
  <g transform="translate(110 200)">
    <rect width="300" height="220" rx="32" fill="#D4FF24"/>
    <rect x="170" y="80" width="150" height="70" rx="20" fill="#030407" fill-opacity="0.85"/>
    <circle cx="212" cy="115" r="14" fill="#D4FF24"/>
    <rect x="36" y="36" width="120" height="16" rx="8" fill="#030407" fill-opacity="0.5"/>
  </g>
  <!-- wallet B -->
  <g transform="translate(790 200)">
    <rect width="300" height="220" rx="32" fill="#1558C9"/>
    <rect x="-20" y="80" width="150" height="70" rx="20" fill="#030407" fill-opacity="0.85"/>
    <circle cx="88" cy="115" r="14" fill="#D4FF24"/>
    <rect x="144" y="36" width="120" height="16" rx="8" fill="#030407" fill-opacity="0.5"/>
  </g>

  <!-- transfer arrow with retries -->
  <path d="M440 310 H760" stroke="#EEF1F6" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 22"/>
  <path d="M735 285 L765 310 L735 335" fill="none" stroke="#EEF1F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Menlo, Consolas, monospace" font-weight="700" font-size="22">
    <rect x="470" y="196" width="80" height="44" rx="10" fill="#ffffff" fill-opacity="0.1"/>
    <text x="490" y="226" fill="#EEF1F6" fill-opacity="0.6">×1</text>
    <rect x="560" y="196" width="80" height="44" rx="10" fill="#ffffff" fill-opacity="0.1"/>
    <text x="580" y="226" fill="#EEF1F6" fill-opacity="0.6">×2</text>
    <rect x="650" y="196" width="80" height="44" rx="10" fill="#ffffff" fill-opacity="0.1"/>
    <text x="670" y="226" fill="#EEF1F6" fill-opacity="0.6">×3</text>
  </g>

  <!-- applied once badge -->
  <rect x="410" y="480" width="400" height="96" rx="48" fill="#D4FF24"/>
  <path d="M470 528 l20 20 l40 -44" fill="none" stroke="#030407" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="542" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="30" fill="#030407">applied once</text>
  <text x="600" y="650" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" fill="#EEF1F6" fill-opacity="0.55">Idempotency-Key: 7f3a…c91e</text>
</svg>

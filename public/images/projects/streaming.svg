<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06102A"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1558C9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1558C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- play button -->
  <circle cx="330" cy="330" r="150" fill="#1558C9"/>
  <circle cx="330" cy="330" r="190" fill="none" stroke="#1558C9" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="330" cy="330" r="235" fill="none" stroke="#1558C9" stroke-opacity="0.15" stroke-width="3"/>
  <path d="M290 250 L410 330 L290 410 Z" fill="#FFFFFF"/>

  <!-- quality ladder -->
  <g font-family="Menlo, Consolas, monospace" font-weight="700" font-size="26">
    <rect x="640" y="150" width="420" height="72" rx="14" fill="#1558C9"/>
    <text x="668" y="196" fill="#FFFFFF">1080p</text>
    <rect x="980" y="170" width="56" height="32" rx="8" fill="#030407" fill-opacity="0.25"/>

    <rect x="640" y="242" width="340" height="72" rx="14" fill="#D4FF24"/>
    <text x="668" y="288" fill="#030407">720p</text>

    <rect x="640" y="334" width="260" height="72" rx="14" fill="#1558C9"/>
    <text x="668" y="380" fill="#FFFFFF">480p</text>

    <rect x="640" y="426" width="180" height="72" rx="14" fill="#EEF1F6"/>
    <text x="668" y="472" fill="#030407">360p</text>
  </g>

  <!-- HLS segment timeline -->
  <g>
    <rect x="96" y="610" width="1008" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="96" y="580" width="118" height="68" rx="10" fill="#1558C9"/>
    <rect x="226" y="580" width="118" height="68" rx="10" fill="#1558C9"/>
    <rect x="356" y="580" width="118" height="68" rx="10" fill="#D4FF24"/>
    <rect x="486" y="580" width="118" height="68" rx="10" fill="#1558C9"/>
    <rect x="616" y="580" width="118" height="68" rx="10" fill="#D4FF24"/>
    <rect x="746" y="580" width="118" height="68" rx="10" fill="#1558C9"/>
    <rect x="876" y="580" width="118" height="68" rx="10" fill="#1558C9" fill-opacity="0.35"/>
    <rect x="1006" y="580" width="98" height="68" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="862" y="560" width="6" height="108" rx="3" fill="#EEF1F6"/>
  </g>
  <text x="96" y="700" font-family="Menlo, Consolas, monospace" font-size="20" fill="#EEF1F6" fill-opacity="0.55">10s segments · quality picked per slice</text>
</svg>

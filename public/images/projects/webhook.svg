<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06102A"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#1558C9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1558C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- links from hub to tenants -->
  <g stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M500 375 C 650 375, 700 170, 860 170" stroke="#4D86E8"/>
    <path d="M500 375 C 650 375, 700 375, 860 375" stroke="#4D86E8"/>
    <path d="M500 375 C 650 375, 700 580, 860 580" stroke="#D4FF24" stroke-dasharray="14 14"/>
  </g>
  <!-- event source into hub -->
  <path d="M150 375 H380" stroke="#EEF1F6" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
  <rect x="96" y="335" width="90" height="80" rx="18" fill="#0F1626" stroke="#EEF1F6" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M126 360 h30 M126 378 h30 M126 396 h20" stroke="#EEF1F6" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

  <!-- hub -->
  <circle cx="440" cy="375" r="96" fill="#1558C9"/>
  <circle cx="440" cy="375" r="128" fill="none" stroke="#1558C9" stroke-opacity="0.3" stroke-width="3"/>
  <path d="M410 335 L470 375 L410 415" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tenants -->
  <g font-family="Menlo, Consolas, monospace" font-weight="700" font-size="24">
    <rect x="860" y="122" width="250" height="96" rx="22" fill="#0F1626" stroke="#4D86E8" stroke-width="3"/>
    <circle cx="902" cy="170" r="14" fill="#4D86E8"/>
    <text x="932" y="179" fill="#EEF1F6">tenant-a 200</text>

    <rect x="860" y="327" width="250" height="96" rx="22" fill="#0F1626" stroke="#4D86E8" stroke-width="3"/>
    <circle cx="902" cy="375" r="14" fill="#4D86E8"/>
    <text x="932" y="384" fill="#EEF1F6">tenant-b 200</text>

    <rect x="860" y="532" width="250" height="96" rx="22" fill="#0F1626" stroke="#D4FF24" stroke-width="3"/>
    <circle cx="902" cy="580" r="14" fill="#D4FF24"/>
    <text x="932" y="589" fill="#EEF1F6">retry · 4s</text>
  </g>

  <!-- retry loop -->
  <path d="M760 520 a46 46 0 1 1 -10 -64" fill="none" stroke="#D4FF24" stroke-width="6" stroke-linecap="round"/>
  <path d="M740 440 l14 18 l-22 6" fill="none" stroke="#D4FF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="96" y="680" font-family="Menlo, Consolas, monospace" font-size="20" fill="#EEF1F6" fill-opacity="0.55">at-least-once · HMAC signed · backoff + DLQ</text>
</svg>

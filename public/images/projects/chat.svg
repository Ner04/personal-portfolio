<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06102A"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4D86E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4D86E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- incoming bubble -->
  <rect x="110" y="120" width="460" height="96" rx="28" fill="#0F1626"/>
  <rect x="150" y="155" width="300" height="14" rx="7" fill="#EEF1F6" fill-opacity="0.75"/>
  <rect x="150" y="183" width="190" height="12" rx="6" fill="#EEF1F6" fill-opacity="0.35"/>

  <!-- outgoing bubble with ticks -->
  <rect x="300" y="250" width="520" height="110" rx="28" fill="#1558C9"/>
  <rect x="340" y="288" width="330" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="340" y="316" width="220" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.5"/>
  <path d="M710 318 l14 14 l26 -30" fill="none" stroke="#D4FF24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M736 318 l14 14 l26 -30" fill="none" stroke="#D4FF24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- encrypted bubble -->
  <rect x="110" y="394" width="520" height="96" rx="28" fill="#0F1626"/>
  <text x="150" y="455" font-family="Menlo, Consolas, monospace" font-size="26" fill="#D4FF24" fill-opacity="0.85">8f3a·c91e·77b0·d4e2·a19f</text>

  <!-- typing indicator -->
  <rect x="110" y="524" width="150" height="70" rx="26" fill="#0F1626"/>
  <circle cx="152" cy="559" r="9" fill="#EEF1F6" fill-opacity="0.8"/>
  <circle cx="185" cy="559" r="9" fill="#EEF1F6" fill-opacity="0.55"/>
  <circle cx="218" cy="559" r="9" fill="#EEF1F6" fill-opacity="0.3"/>

  <!-- big padlock -->
  <g transform="translate(860 240)">
    <path d="M40 150 V100 a90 90 0 0 1 180 0 V150" fill="none" stroke="#EEF1F6" stroke-width="30" stroke-linecap="round"/>
    <rect x="0" y="140" width="260" height="220" rx="36" fill="#EEF1F6"/>
    <circle cx="130" cy="235" r="26" fill="#030407"/>
    <rect x="118" y="245" width="24" height="60" rx="10" fill="#030407"/>
  </g>
  <text x="1110" y="660" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="20" fill="#EEF1F6" fill-opacity="0.55">server stores ciphertext only</text>
</svg>
